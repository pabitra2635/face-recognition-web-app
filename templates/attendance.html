{% extends 'base.html' %}

{% block content %}
<div class="card" style="text-align: center;">
    <h1>Real-Time Attendance</h1>
    <p style="color: var(--text-muted); margin-bottom: 2rem;">Recognized faces will be automatically logged to today's sheet.</p>

    <div class="video-wrapper">
        <video id="webcam" autoplay playsinline style="display:none;"></video>
        <canvas id="canvas" style="display:none;"></canvas>
        <img id="processed-frame" class="video-feed" style="display: none; width: 100%;">
        <p id="loading-text" style="padding: 2rem;">Starting camera...</p>
    </div>

    <div style="margin-top: 2rem; display: flex; justify-content: center; gap: 1rem;">
        <a href="/logs" class="btn btn-primary">
            <i class="fas fa-list-alt"></i> View Today's Logs
        </a>
        <button class="btn" style="background: var(--danger); color: white;" onclick="stopAttendance()">
            <i class="fas fa-stop"></i> Stop System
        </button>
    </div>
</div>

<script>
let captureInterval;
let isProcessing = false;
const video = document.getElementById('webcam');
const canvas = document.getElementById('canvas');
const processedFrame = document.getElementById('processed-frame');
const loadingText = document.getElementById('loading-text');

async function startCamera() {
    try {
        const stream = await navigator.mediaDevices.getUserMedia({ video: true });
        video.srcObject = stream;
        
        video.onloadedmetadata = () => {
            loadingText.style.display = 'none';
            processedFrame.style.display = 'block';
            
            captureInterval = setInterval(async () => {
                if (isProcessing) return;
                isProcessing = true;

                canvas.width = video.videoWidth || 640;
                canvas.height = video.videoHeight || 480;
                if (canvas.width === 0) {
                    isProcessing = false;
                    return;
                }
                
                const ctx = canvas.getContext('2d');
                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                
                const imageData = canvas.toDataURL('image/jpeg', 0.8);
                
                try {
                    const response = await fetch('/process_frame', {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({
                            image: imageData,
                            mode: 'attendance'
                        })
                    });
                    const data = await response.json();
                    if (data.image) {
                        processedFrame.src = data.image;
                    }
                } catch (err) {
                    console.error(err);
                } finally {
                    isProcessing = false;
                }
                
            }, 300); // Evaluate every 300ms, but skips if processing
        };
        
    } catch (err) {
        console.error("Error accessing webcam:", err);
        loadingText.innerText = "Could not access webcam. Please allow permissions.";
    }
}

window.onload = startCamera;

function stopAttendance() {
    if (captureInterval) clearInterval(captureInterval);
    if (video.srcObject) {
        video.srcObject.getTracks().forEach(track => track.stop());
    }
    window.location.href = '/';
}
</script>
{% endblock %}
